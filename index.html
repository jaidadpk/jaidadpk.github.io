<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAIDAD PAKISTAN - Buy Sale Option Lazmi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:#f1f5f9}
.header{background:#0f172a;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}
.search-bar{background:#fff;padding:12px;position:sticky;top:52px;z-index:999;box-shadow:0 2px 10px rgba(0,0,0,.1);border-bottom:3px solid #fbbf24}
.input,select{width:100%;padding:11px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:13px;font-weight:600;margin:4px 0}
.btn{padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer;width:100%}
.btn:active{transform:scale(.97)}
.card{background:#fff;margin:10px;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.prop{background:#fff;border-radius:14px;overflow:hidden;margin:10px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.badge{padding:5px 10px;border-radius:20px;font-size:10px;font-weight:800;display:inline-block;margin:2px}
.tab{padding:8px 14px;border-radius:20px;border:1.5px solid #e2e8f0;background:#fff;font-size:12px;font-weight:700;cursor:pointer;margin:3px;display:inline-block}
.tab.active{background:#0f172a;color:#fbbf24;border-color:#0f172a}
.whatsapp{position:fixed;bottom:15px;right:12px;background:#25D366;color:#fff;padding:12px 18px;border-radius:30px;font-weight:800;text-decoration:none;z-index:9999}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#picModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);z-index:10000;padding:15px;overflow:auto}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:8px"><img src="logo.png" style="height:36px;background:#fff;border-radius:6px;padding:3px" onerror="this.style.display='none'"><div><b>JAIDAD <span style="color:#fbbf24">PAKISTAN</span></b><div style="font-size:9px">Sharaqpur | Sheikhupura | 03334113473</div></div></div>
<div style="background:#fbbf24;color:#0f172a;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800">BUY SALE LAZMI</div>
</div>

<div style="max-width:800px;margin:0 auto;padding-bottom:90px">
<div class="card" style="background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff">
<h3 style="color:#fbbf24">➕ ADD PROPERTY - تصویر اور Detail آسان</h3>
<input id="f_title" class="input" placeholder="Title * لازمی - مثلا 5 مرلہ مکان برائے فروخت">
<div class="grid2">
<select id="f_purpose" class="input" style="border:2px solid #fbbf24"><option value="">Purpose * لازمی - Buy / Sale</option><option>For Sale</option><option>For Rent</option><option>Commission</option><option>Investment</option><option>Wanted</option></select>
<select id="f_type" class="input"><option value="">Type * لازمی</option><option>House</option><option>Plot / File</option><option>Commercial</option><option>Agricultural Land</option><option>Farm House</option><option>Flat</option></select>
</div>
<div class="grid2">
<select id="f_city" class="input"><option value="">City * لازمی</option><option>Sharaqpur Sharif</option><option>Sheikhupura</option><option>Lahore</option><option>All Pakistan</option></select>
<input id="f_size" class="input" placeholder="Size * مثلا 5 Marla">
</div>
<div class="grid2">
<input id="f_price" class="input" placeholder="Price * لازمی">
<input id="f_area" class="input" placeholder="Location * لازمی">
</div>
<input id="f_wa" class="input" placeholder="WhatsApp * 923334113473" value="923334113473">
<p style="font-size:12px;color:#fbbf24;margin:6px 0">📸 اپنی 3 تصویریں یہاں سے Add کریں - آسان</p>
<input type="file" id="pic1" accept="image/*" class="input" onchange="showImg(this,'i1')"><img id="i1" style="width:100%;height:160px;object-fit:cover;border-radius:8px;display:none;margin-bottom:8px">
<input type="file" id="pic2" accept="image/*" class="input" onchange="showImg(this,'i2')"><img id="i2" style="width:100%;height:160px;object-fit:cover;border-radius:8px;display:none;margin-bottom:8px">
<input type="file" id="pic3" accept="image/*" class="input" onchange="showImg(this,'i3')"><img id="i3" style="width:100%;height:160px;object-fit:cover;border-radius:8px;display:none;margin-bottom:8px">
<textarea id="f_desc" class="input" rows="4" placeholder="مکمل Detail * یہاں لکھیں - مکان کیسا ہے، سہولتیں کیا ہیں"></textarea>
<button class="btn" style="background:#fbbf24;color:#0f172a;font-size:17px" onclick="publishNow()">✅ PUBLISH - اب لازمی Buy Sale کے ساتھ</button>
<button class="btn" style="background:#fff;color:#0f172a;margin-top:6px;border:1px solid #e2e8f0" onclick="clearForm()">Clear Form</button>
</div>
<div id="list"></div>
</div>

<div id="picModal" onclick="if(event.target.id=='picModal')closeModal()"><div style="background:white;max-width:650px;margin:20px auto;border-radius:16px;padding:16px;position:relative"><span onclick="closeModal()" style="position:absolute;top:10px;right:18px;font-size:32px;cursor:pointer;color:red">×</span><img id="modalImg" src="" style="width:100%;border-radius:12px;max-height:380px;object-fit:cover"><h2 id="modalTitle" style="margin:14px 0 5px 0"></h2><p id="modalPrice" style="color:#16a34a;font-weight:800;font-size:20px"></p><p id="modalLocation" style="color:#64748b"></p><hr style="margin:10px 0"><p id="modalDetail" style="white-space:pre-line;line-height:1.6"></p><a id="modalWhatsapp" href="#" target="_blank" style="display:block;text-align:center;margin-top:15px;padding:14px;background:#25D366;color:white;border-radius:10px;text-decoration:none;font-weight:800">WhatsApp پر رابطہ</a></div></div>
<a class="whatsapp" href="https://wa.me/923334113473">💬 WhatsApp 03334113473</a>

<script>
let allProps=JSON.parse(localStorage.getItem('jaidad_v4_final')||'[]');
function showImg(input,id){let img=document.getElementById(id);if(input.files&&input.files[0]){let r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display='block'};r.readAsDataURL(input.files[0])}}
function publishNow(){
 let t=document.getElementById('f_title').value.trim(), pu=document.getElementById('f_purpose').value, ty=document.getElementById('f_type').value, ci=document.getElementById('f_city').value, pr=document.getElementById('f_price').value.trim(), wa=document.getElementById('f_wa').value.trim();
 if(!t||!pu||!ty||!ci||!pr||!wa){alert('❌ لازمی چیزیں بھریں: Title, Buy/Sale (Purpose), Type, City, Price, WhatsApp');return;}
 let waClean=wa.replace(/[^0-9]/g,''); if(waClean.startsWith('0'))waClean='92'+waClean.slice(1);
 let obj={id:Date.now(),title:t,purpose:pu,type:ty,city:ci,size:document.getElementById('f_size').value,price:pr,area:document.getElementById('f_area').value,wa:waClean,desc:document.getElementById('f_desc').value,img1:document.getElementById('i1').src||'',img2:document.getElementById('i2').src||'',img3:document.getElementById('i3').src||'',date:new Date().toLocaleDateString()};
 allProps.unshift(obj);localStorage.setItem('jaidad_v4_final',JSON.stringify(allProps));render(allProps);alert('✅ کامیاب! آپ کی تصویر اور Detail کے ساتھ Ad لگ گئی - Buy/Sale: '+pu);clearForm();
}
function clearForm(){['f_title','f_size','f_price','f_area','f_desc'].forEach(id=>document.getElementById(id).value='');['i1','i2','i3'].forEach(id=>{let im=document.getElementById(id);im.src='';im.style.display='none';});document.getElementById('pic1').value='';document.getElementById('pic2').value='';document.getElementById('pic3').value='';}
function openModalData(p){document.getElementById('modalImg').src=p.img1||p.img2||'logo.png';document.getElementById('modalTitle').innerText=p.title;document.getElementById('modalPrice').innerText=p.purpose+' - Rs. '+p.price;document.getElementById('modalLocation').innerText='📍 '+p.area+' | '+p.city;document.getElementById('modalDetail').innerText=p.desc;document.getElementById('modalWhatsapp').href='https://wa.me/'+p.wa;document.getElementById('picModal').style.display='block';}
function closeModal(){document.getElementById('picModal').style.display='none';}
function render(data){
 let html=''; data.forEach(p=>{
  let mainImg=p.img1&&p.img1.startsWith('data:')?p.img1:'';
  html+=`<div class="prop" onclick='openModalData(${JSON.stringify(p).replace(/'/g,"&#39;")})'><div style="padding:12px">${mainImg?`<img src="${mainImg}" style="width:100%;height:200px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:`<div style="width:100%;height:120px;background:#f1f5f9;border-radius:10px;display:flex;align-items:center;justify-content:center">📷 تصویر پر کلک کر کے تفصیل دیکھیں</div>`}<span class="badge" style="background:#0f172a;color:#fbbf24">${p.purpose}</span><span class="badge" style="background:#dbeafe;color:#1e40af">${p.type} ${p.size||''}</span><h3 style="margin:8px 0">${p.title}</h3><p style="font-weight:800;color:#16a34a">${p.price} - ${p.area}</p><p style="font-size:11px;color:#64748b">${p.date}</p><p style="font-size:12px">${(p.desc||'').substring(0,100)}</p><div style="display:flex;gap:8px;margin-top:8px"><a href="https://wa.me/${p.wa}" target="_blank" style="flex:1;background:#25D366;color:#fff;padding:10px;border-radius:8px;text-align:center;text-decoration:none;font-weight:800" onclick="event.stopPropagation()">WhatsApp</a><button style="flex:1;background:#fee2e2;color:#991b1b;border:none;border-radius:8px;font-weight:800" onclick="event.stopPropagation();deleteOne(${p.id})">Delete</button></div></div></div>`;
 });
 document.getElementById('list').innerHTML=html||'<div class="card" style="text-align:center">ابھی کوئی Ad نہیں - اوپر سے اپنی تصویر اور Detail Add کریں</div>';
}
function deleteOne(id){if(confirm('Delete کریں؟')){allProps=allProps.filter(p=>p.id!==id);localStorage.setItem('jaidad_v4_final',JSON.stringify(allProps));render(allProps);}}
render(allProps);
</script>
</body>
</html>
