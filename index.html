<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JaidadPk | Pakistan Property Portal</title>

<meta name="description" content="JaidadPk Pakistan property portal. Find houses, plots, apartments and rental properties. Contact us on WhatsApp.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green: #087c55;
    --dark: #075c40;
    --light: #eaf7f0;
    --text: #24352e;
    --muted: #6b7b73;
    --white: #ffffff;
}

body {
    font-family: Arial, "Noto Sans Arabic", sans-serif;
    color: var(--text);
    background: #f7f9f8;
    line-height: 1.6;
}

a {
    text-decoration: none;
    color: inherit;
}

button, input, select {
    font: inherit;
}

.container {
    width: 92%;
    max-width: 1200px;
    margin: auto;
}

/* HEADER */

header {
    background: white;
    box-shadow: 0 2px 12px #0000000b;
    position: sticky;
    top: 0;
    z-index: 100;
}

.navbar {
    min-height: 76px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--green);
    font-size: 28px;
    font-weight: 800;
}

.logo-icon {
    width: 44px;
    height: 44px;
    background: var(--green);
    color: white;
    display: grid;
    place-items: center;
    border-radius: 12px;
    font-size: 25px;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 15px;
    font-weight: 600;
}

.nav-links a:hover {
    color: var(--green);
}

.btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 11px 19px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.2s;
}

.btn-primary {
    background: var(--green);
    color: white;
}

.btn-primary:hover {
    background: var(--dark);
}

.btn-outline {
    border: 1px solid var(--green);
    color: var(--green);
    background: white;
}

/* HERO */

.hero {
    background:
        linear-gradient(110deg, rgba(3,55,39,.91), rgba(8,124,85,.75)),
        url("https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    min-height: 470px;
    display: flex;
    align-items: center;
    color: white;
    padding: 65px 0;
}

.hero-content {
    max-width: 820px;
    margin: auto;
    text-align: center;
}

.hero h1 {
    font-size: clamp(32px, 5vw, 54px);
    line-height: 1.25;
    margin-bottom: 18px;
}

.hero p {
    font-size: 18px;
    margin-bottom: 30px;
    color: #f0fff6;
}

.search-box {
    background: white;
    border-radius: 13px;
    padding: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr auto;
    gap: 10px;
    box-shadow: 0 10px 35px #00000020;
}

.search-box select,
.search-box input {
    min-width: 0;
    width: 100%;
    padding: 13px;
    border: 1px solid #e1e8e4;
    border-radius: 7px;
    outline: none;
    background: white;
    color: #34483e;
}

.search-box select:focus,
.search-box input:focus {
    border-color: var(--green);
}

/* GENERAL SECTIONS */

section {
    padding: 65px 0;
}

.section-heading {
    text-align: center;
    margin-bottom: 35px;
}

.section-heading h2 {
    font-size: 32px;
    margin-bottom: 8px;
}

.section-heading p {
    color: var(--muted);
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.category-card {
    background: white;
    padding: 28px 15px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #edf1ee;
    transition: 0.2s;
}

.category-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px #0000000b;
}

.category-icon {
    font-size: 38px;
    margin-bottom: 10px;
}

.category-card h3 {
    margin-bottom: 5px;
}

.category-card p {
    font-size: 14px;
    color: var(--muted);
}

.properties-section {
    background: #f0f5f2;
}

.property-grid {
    display: grid
