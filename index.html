<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

.logo-icon{width:52px;height:52px;background:linear-gradient(135deg,#0f172a,#1e40af);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fbbf24;font-size:26px;font-weight:900}
.nav{display:flex;background:#fff;padding:12px;gap:10px;overflow-x:auto;position:sticky;top:76px;z-index:999}
.nav button{padding:10px 18px;border-radius:25px;border:1px solid #e2e8f0;background:#fff;font-weight:800;cursor:pointer;white-space:nowrap}
.nav button.active{background:#0f172a;color:#fbbf24}
.page{display:none}.page.active{display:block}
.card{background:#fff;margin:12px;border-radius:16px;padding:16px;box-shadow:0 3px 15px #0001}
.hero{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;margin:12px;border-radius:18px;padding:32px 20px;text-align:center}
.btn{padding:10px 16px;border-radius:25px;border:none;font-weight:800;color:#fff;margin:3px;display:inline-block;cursor:pointer}
.btn-dark{background:#0f172a}.btn-blue{background:#1e40af}.btn-green{background:#25D366}.btn-gold{background:#fbbf24;color:#000}
.prop-card{border:1px solid #e2e8f0;border-radius:18px;overflow:hidden;margin:16px 0;background:#fff;cursor:pointer;box-shadow:0 4px 15px #0001}
.prop-card img{width:100%;height:300px;object-fit:cover}
.prop-info{padding:14px}.prop-price{font-size:22px;font-weight:900;color:#16a34a}
.badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;display:inline-block;margin:3px}
.b-sale{background:#ef4444}.b-buy{background:#16a34a}.b-city{background:#0f172a}
#map{height:420px;width:100%;border-radius:16px}

</style></head><body>
<div class="header"><div style="display:flex;gap:12px;align-items:center"><div class="logo-icon">J</div><div><h2 style="font-size:18px;font-weight:900">JAIDAD PAKISTAN</h2><p style="font-size:11px;opacity:.7">03334113473 • LAHORE + ALL PAKISTAN</p></div></div><button class="btn btn-gold" onclick="showPage('home')">🏠</button></div>
<div class="nav"><button class="active" onclick="showPage('home')" id="b-home">🏠 Home</button><button onclick="showPage('search')" id="b-search">🔍 Search</button><button onclick="showPage('city')" id="b-city">📍 Cities</button><button onclick="showPage('mapPage')" id="b-map">🗺️ Map</button><button onclick="showPage('add')" id="b-add">➕ Add</button></div>
<div id="home" class="page active"><div class="hero"><h1>Find Your Property in Pakistan</h1><p style="margin-top:8px">Lahore ⭐ Sheikhupura • Sharaqpur • All Cities</p><p style="margin-top:12px;background:#fbbf24;color:#000;padding:8px 14px;border-radius:20px;display:inline-block;font-weight:800">0333-4113473 CALL NOW</p></div><div class="card"><div id="homeList"></div></div></div>
<div id="search" class="page"><div class="card"><h3>🔍 Search</h3><input id="sInput" placeholder="Lahore, Sheikhupura..." oninput="doSearch()"><div id="searchResult"></div></div></div>
<div id="city" class="page"><div class="card"><h3>📍 Cities</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0"><div onclick="filterCity('Lahore')" style="padding:16px;border:2px solid #0f172a;border-radius:14px;text-align:center;font-weight:900;cursor:pointer">Lahore ⭐</div><div onclick="filterCity('Sheikhupura')" style="padding:16px;border:1px solid #ddd;border-radius:14px;text-align:center;font-weight:800;cursor:pointer">Sheikhupura</div><div onclick="filterCity('Sharaqpur')" style="padding:16px;border:1px solid #ddd;border-radius:14px;text-align:center;font-weight:800;cursor:pointer">Sharaqpur</div><div onclick="filterCity('Faisalabad')" style="padding:16px;border:1px solid #ddd;border-radius:14px;text-align:center;font-weight:800;cursor:pointer">Faisalabad</div></div><div id="cityResult"></div></div></div>
<div id="mapPage" class="page"><div class="card"><h3>🗺️ Map View</h3><div id="map"></div></div></div>
<div id="add" class="page"><div class="card"><h3>➕ Add Property - FREE</h3><input id="aTitle" placeholder="Title e.g 5 Marla Plot"><input id="aPrice" placeholder="Price e.g 35 Lakh"><input id="aCity" placeholder="City e.g Lahore"><button class="btn btn-dark" style="width:100%;padding:15px;margin-top:10px" onclick="publishProp()">✅ Publish FREE</button></div></div>
<div id="detailModal" onclick="closeDetail()"><div id="detailBox" onclick="event.stopPropagation()"><div style="position:relative"><img id="detailImg" src="" style="width:100%;height:480px;object-fit:cover"><span onclick="closeDetail()" style="position:absolute;top:12px;right:12px;background:white;width:42px;height:42px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:28px;cursor:pointer;font-weight:bold">×</span><div style="position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.7);color:white;padding:6px 14px;border-radius:20px;font-weight:800" id="detailType"></div></div><div style="padding:18px"><h2 id="detailTitle"></h2><h2 id="detailPrice" style="color:#16a34a;margin:10px 0"></h2><p id="detailCity" style="color:#64748b;font-weight:700"></p><p id="detailDesc" style="margin-top:12px;background:#f1f5f9;padding:12px;border-radius:12px"></p><div style="display:flex;gap:10px;margin-top:18px"><a id="detailWhatsapp" class="btn btn-green" style="flex:1;text-align:center;padding:16px" target="_blank">📱 WhatsApp</a><button class="btn btn-blue" style="flex:1;padding:16px" onclick="goToMap()">📍 Map</button></div><button class="btn btn-dark" style="width:100%;margin-top:12px;padding:14px" onclick="closeDetail()">⬅️ Back</button></div></div></div>
<script>
var map=L.map('map').setView([31.52,74.35],7); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let properties=[{title:"5 Marla Plot - Bhikhi Road Sheikhupura",city:"Sheikhupura",type:"sale",price:"35 Lakh",lat:31.7131,lng:73.9783,img:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800",desc:"Registry Intiqal - Electricity, Water, Gas Available"},{title:"10 Marla House - Bahria Town Lahore",city:"Lahore",type:"sale",price:"1.2 Crore",lat:31.4697,lng:74.2742,img:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800",desc:"2 Bed, Drawing, Kitchen, Garage"},{title:"Need 5 Marla - Sharaqpur City",city:"Sharaqpur",type:"buy",price:"30 Lakh Budget",lat:31.4623,lng:74.1364,img:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800",desc:"Buyer Needs Plot - Cash Payment"}];
let currentLat=0,currentLng=0;
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let btn=document.getElementById('b-'+id); if(btn) btn.classList.add('active'); if(id=='mapPage') setTimeout(()=>{map.invalidateSize();},400);}
function createCard(p,i){return `<div class="prop-card" onclick="openDetail(${i})"><img src="${p.img}"><div class="prop-info"><div class="prop-price">Rs. ${p.price}</div><div style="font-weight:800;margin:6px 0;font-size:17px">${p.title}</div><div style="font-size:13px;color:#64748b">📍 ${p.city}</div><div style="margin-top:10px"><span class="badge ${p.type=='sale'?'b-sale':'b-buy'}">${p.type=='sale'?'For Sale':'Need'}</span> <span class="badge b-city">${p.city}</span></div></div></div>`;}
function render(){let h=document.getElementById('homeList');h.innerHTML='';properties.forEach((p,i)=>{h.innerHTML+=createCard(p,i);L.marker([p.lat,p.lng]).addTo(map).bindPopup(p.title);});}
render();
function openDetail(index){let p=properties[index];document.getElementById('detailImg').src=p.img;document.getElementById('detailTitle').innerText=p.title;document.getElementById('detailPrice').innerText='Rs. '+p.price;document.getElementById('detailCity').innerText='📍 '+p.city;document.getElementById('detailDesc').innerText=p.desc;document.getElementById('detailType').innerText=p.type=='sale'?'For Sale':'Need Plot';document.getElementById('detailWhatsapp').href=`https://wa.me/923334113473?text=${encodeURIComponent(p.title+' - '+p.price)}`;currentLat=p.lat;currentLng=p.lng;document.getElementById('detailModal').style.display='block';document.body.style.overflow='hidden';}
function closeDetail(){document.getElementById('detailModal').style.display='none';document.body.style.overflow='auto';}
function goToMap(){closeDetail();showPage('mapPage');setTimeout(()=>{map.setView([currentLat,currentLng],15)},400);}
function filterCity(city){let f=properties.filter(p=>p.city==city);let r=document.getElementById('cityResult');r.innerHTML=`<h4 style="margin:12px 0">${city} (${f.length})</h4>`;f.forEach((p)=>{r.innerHTML+=createCard(p,properties.indexOf(p));});}
function doSearch(){let txt=document.getElementById('sInput').value.toLowerCase();let f=properties.filter(p=>p.title.toLowerCase().includes(txt)||p.city.toLowerCase().includes(txt));let r=document.getElementById('searchResult');r.innerHTML='';f.forEach(p=>{r.innerHTML+=createCard(p,properties.indexOf(p));});}
function publishProp(){let t=document.getElementById('aTitle').value;if(!t) return alert('Title likhen');properties.unshift({title:t,city:document.getElementById('aCity').value||"Lahore",type:"sale",price:document.getElementById('aPrice').value||"On Call",lat:31.52+Math.random(),lng:74.35+Math.random(),img:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800",desc:"New Added by Owner"});render();alert('Published!');showPage('home');}
</script></body></html>
